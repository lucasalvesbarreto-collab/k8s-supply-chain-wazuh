name: Build e publicar imagem

on:
  push:
    branches: [main]
    paths:
      - "fase-1-supply-chain/app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# Menor privilégio por padrão: nenhum job recebe nada além de leitura
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Permissões do job: só o que o build precisa
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=sha,format=long

      - name: Build e push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./fase-1-supply-chain/app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resumo com o digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: $TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
