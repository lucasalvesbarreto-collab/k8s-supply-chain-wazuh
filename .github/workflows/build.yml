name: Build e publicar imagem

on:
  push:
    branches: [main]
    paths:
      - "fase-1-supply-chain/app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# Menor privilégio por padrão: nenhum job recebe nada além de leitura
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Permissões do job: só o que o build precisa
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/app
          tags: |
            type=sha,format=long

      - name: Build e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./fase-1-supply-chain/app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resumo com o digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: $TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
