name: Validar

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: este workflow só precisa LER o repositório
permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Instalar yamllint e xmllint
        run: sudo apt-get update && sudo apt-get install -y yamllint libxml2-utils

      - name: Validar YAML
        run: yamllint .

      - name: Validar XML das regras do Wazuh
        run: |
          shopt -s globstar nullglob
          for f in **/*.xml; do
            echo "Validando $f"
            (echo "<root>"; cat "$f"; echo "</root>") | xmllint --noout -
          done
